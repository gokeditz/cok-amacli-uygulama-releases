<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Dans Ediyor</title>
<style>
  :root {
    --bg: #fbf7f2;
    --ink: #2b2118;
    --muted: #7a6a5c;
    --clawd: #d97757;
    --clawd-dark: #b85f42;
    --eye: #1f1a17;
    --tile-a: #f3d9c9;
    --tile-b: #e9c2ab;
    --btn: #ffffff;
    --btn-border: #e2d3c6;
    --beat: 0.5s;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17120f; --ink: #f4ebe3; --muted: #b3a294;
      --tile-a: #2a1d17; --tile-b: #3a271e;
      --btn: #241b16; --btn-border: #3d2d24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17120f; --ink: #f4ebe3; --muted: #b3a294;
    --tile-a: #2a1d17; --tile-b: #3a271e;
    --btn: #241b16; --btn-border: #3d2d24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; overflow-x: hidden;
  }
  h1 { font-size: clamp(20px, 5vw, 30px); margin: 0 0 4px; letter-spacing: .02em; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; text-align: center; }

  .stage {
    position: relative; width: min(520px, 100%); aspect-ratio: 1 / 1;
    border-radius: 20px; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--clawd) 18%, transparent), transparent 65%);
  }
  .lights { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: .0; transition: opacity .3s; }
  .party .lights { opacity: .55; }
  .lights span {
    position: absolute; top: -20%; width: 40%; height: 140%;
    transform-origin: 50% 0;
    background: linear-gradient(to bottom, var(--c), transparent 80%);
    filter: blur(14px);
    animation: sweep calc(var(--beat) * 8) ease-in-out infinite alternate;
  }
  .lights span:nth-child(1) { left: 0;   --c: #ff5fa2; }
  .lights span:nth-child(2) { left: 30%; --c: #5fd4ff; animation-delay: calc(var(--beat) * -3); }
  .lights span:nth-child(3) { left: 60%; --c: #ffd25f; animation-delay: calc(var(--beat) * -6); }
  @keyframes sweep { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }

  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(3, 1fr);
    transform: perspective(300px) rotateX(45deg); transform-origin: bottom;
  }
  .floor i { background: var(--tile-a); border: 1px solid var(--bg); }
  .floor i:nth-child(odd) { background: var(--tile-b); }
  .party .floor i { animation: tile calc(var(--beat) * 2) steps(1) infinite; }
  .party .floor i:nth-child(3n)   { animation-delay: calc(var(--beat) * -1); }
  .party .floor i:nth-child(3n+1) { animation-delay: calc(var(--beat) * -.5); }
  @keyframes tile {
    0%  { background: #ff5fa2; } 25% { background: #5fd4ff; }
    50% { background: #ffd25f; } 75% { background: var(--clawd); }
  }

  .shadow {
    position: absolute; left: 50%; bottom: 17%; width: 46%; height: 5%;
    transform: translateX(-50%); border-radius: 50%;
    background: rgba(0,0,0,.18);
    animation: shadow var(--beat) ease-in-out infinite;
  }
  @keyframes shadow { 50% { width: 36%; opacity: .6; } }

  .dancer {
    position: absolute; left: 50%; bottom: 19%; width: 56%;
    transform: translateX(-50%);
  }
  .dancer svg { display: block; width: 100%; overflow: visible; }
  svg * { transform-box: fill-box; }
  .body-g, .arm, .leg, .eyes { transform-origin: center; }
  .arm.l { transform-origin: right center; }
  .arm.r { transform-origin: left center; }
  .leg { transform-origin: top center; }

  /* göz kırpma her modda */
  .eyes { animation: blink 3.7s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  /* --- ZIPLA --- */
  .m-bounce .body-g { animation: bounce var(--beat) cubic-bezier(.3,0,.4,1) infinite; }
  .m-bounce .arm.l  { animation: armL var(--beat) ease-in-out infinite; }
  .m-bounce .arm.r  { animation: armR var(--beat) ease-in-out infinite; }
  .m-bounce .leg:nth-of-type(odd)  { animation: legA var(--beat) ease-in-out infinite; }
  .m-bounce .leg:nth-of-type(even) { animation: legB var(--beat) ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1.06, .94); }
    50% { transform: translateY(-14%) scale(.96, 1.04); }
  }
  @keyframes armL { 50% { transform: rotate(-35deg) translateY(-20%); } }
  @keyframes armR { 50% { transform: rotate(35deg) translateY(-20%); } }
  @keyframes legA { 50% { transform: rotate(18deg); } }
  @keyframes legB { 50% { transform: rotate(-18deg); } }

  /* --- SALLAN --- */
  .m-sway .body-g { animation: sway calc(var(--beat) * 2) ease-in-out infinite; transform-origin: bottom center; }
  .m-sway .arm.l  { animation: waveL calc(var(--beat) * 2) ease-in-out infinite; }
  .m-sway .arm.r  { animation: waveR calc(var(--beat) * 2) ease-in-out infinite; }
  .m-sway .leg:nth-of-type(odd)  { animation: legA calc(var(--beat) * 2) ease-in-out infinite; }
  .m-sway .leg:nth-of-type(even) { animation: legB calc(var(--beat) * 2) ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-12deg) translateX(-8%); }
    50%      { transform: rotate(12deg) translateX(8%); }
  }
  @keyframes waveL { 0%,100% { transform: rotate(-70deg); } 50% { transform: rotate(10deg); } }
  @keyframes waveR { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(70deg); } }

  /* --- SHUFFLE --- */
  .m-shuffle .body-g { animation: shuffle calc(var(--beat) * 2) steps(4) infinite; }
  .m-shuffle .arm.l  { animation: punchL calc(var(--beat)) ease-out infinite; }
  .m-shuffle .arm.r  { animation: punchR calc(var(--beat)) ease-out infinite; animation-delay: calc(var(--beat) * -.5); }
  .m-shuffle .leg    { animation: kick calc(var(--beat) / 2) ease-in-out infinite; }
  .m-shuffle .leg:nth-of-type(even) { animation-delay: calc(var(--beat) / -4); }
  @keyframes shuffle {
    0%   { transform: translateX(-14%); }
    25%  { transform: translateX(0) translateY(-5%); }
    50%  { transform: translateX(14%); }
    75%  { transform: translateX(0) translateY(-5%); }
    100% { transform: translateX(-14%); }
  }
  @keyframes punchL { 30% { transform: translateX(-60%) translateY(-60%); } }
  @keyframes punchR { 30% { transform: translateX(60%) translateY(-60%); } }
  @keyframes kick { 50% { transform: rotate(30deg) scaleY(.8); } }

  /* --- DÖN --- */
  .m-spin .body-g { animation: spin calc(var(--beat) * 4) cubic-bezier(.6,0,.4,1) infinite; }
  .m-spin .arm.l  { animation: armL var(--beat) ease-in-out infinite; }
  .m-spin .arm.r  { animation: armR var(--beat) ease-in-out infinite; }
  .m-spin .leg:nth-of-type(odd)  { animation: legA calc(var(--beat)/2) ease-in-out infinite; }
  .m-spin .leg:nth-of-type(even) { animation: legB calc(var(--beat)/2) ease-in-out infinite; }
  @keyframes spin {
    0%   { transform: scaleX(1) translateY(0); }
    25%  { transform: scaleX(-1) translateY(-12%); }
    50%  { transform: scaleX(1) translateY(0); }
    62%  { transform: rotate(0) translateY(-22%); }
    88%  { transform: rotate(360deg) translateY(-22%); }
    100% { transform: rotate(360deg) translateY(0); }
  }

  .notes { position: absolute; inset: 0; pointer-events: none; }
  .notes b {
    position: absolute; bottom: 45%; font-size: clamp(18px, 4vw, 26px);
    color: var(--clawd); opacity: 0;
    animation: note calc(var(--beat) * 4) linear infinite;
  }
  .notes b:nth-child(1) { left: 18%; }
  .notes b:nth-child(2) { left: 76%; animation-delay: calc(var(--beat) * -1.3); }
  .notes b:nth-child(3) { left: 30%; animation-delay: calc(var(--beat) * -2.6); }
  .notes b:nth-child(4) { left: 66%; animation-delay: calc(var(--beat) * -3.4); }
  @keyframes note {
    0%   { transform: translateY(0) rotate(-10deg); opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: translateY(-160%) rotate(15deg); opacity: 0; }
  }

  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-top: 18px; width: min(520px, 100%);
  }
  button {
    font: inherit; font-size: 14px; color: var(--ink);
    background: var(--btn); border: 1.5px solid var(--btn-border);
    padding: 9px 14px; border-radius: 999px; cursor: pointer;
    transition: transform .1s, border-color .2s;
  }
  button:hover { border-color: var(--clawd); }
  button:active { transform: scale(.96); }
  button[aria-pressed="true"] { background: var(--clawd); border-color: var(--clawd); color: #fff; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  input[type=range] { accent-color: var(--clawd); width: 140px; }

  @media (prefers-reduced-motion: reduce) {
    .stage:not(.forced) * { animation-play-state: paused !important; }
  }
</style>
</head>
<body>
  <h1>Clawd dans ediyor</h1>
  <p class="sub">Hareketi seç, tempoyu ayarla, parti modunu aç.</p>

  <div class="stage m-bounce" id="stage">
    <div class="lights"><span></span><span></span><span></span></div>
    <div class="floor" id="floor"></div>
    <div class="notes"><b>♪</b><b>♫</b><b>♪</b><b>♬</b></div>
    <div class="shadow"></div>
    <div class="dancer">
      <svg viewBox="0 0 22 14" shape-rendering="crispEdges" aria-label="Dans eden Clawd">
        <g class="body-g">
          <rect class="arm l" x="0.5" y="5" width="3" height="2.4" fill="var(--clawd)"/>
          <rect class="arm r" x="18.5" y="5" width="3" height="2.4" fill="var(--clawd)"/>
          <g class="legs">
            <rect class="leg" x="4.5"  y="9.5" width="1.4" height="3.5" fill="var(--clawd-dark)"/>
            <rect class="leg" x="7.5"  y="9.5" width="1.4" height="3.5" fill="var(--clawd-dark)"/>
            <rect class="leg" x="13.1" y="9.5" width="1.4" height="3.5" fill="var(--clawd-dark)"/>
            <rect class="leg" x="16.1" y="9.5" width="1.4" height="3.5" fill="var(--clawd-dark)"/>
          </g>
          <rect x="3.5" y="1.5" width="15" height="8.6" fill="var(--clawd)"/>
          <g class="eyes">
            <rect x="7"    y="3.6" width="1.5" height="2.6" fill="var(--eye)"/>
            <rect x="13.5" y="3.6" width="1.5" height="2.6" fill="var(--eye)"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <div class="controls" id="moves">
    <button data-move="bounce" aria-pressed="true">Zıpla</button>
    <button data-move="sway" aria-pressed="false">Sallan</button>
    <button data-move="shuffle" aria-pressed="false">Shuffle</button>
    <button data-move="spin" aria-pressed="false">Dön</button>
  </div>
  <div class="row">
    <label for="bpm">Tempo</label>
    <input id="bpm" type="range" min="70" max="180" value="120">
    <span id="bpmVal">120 BPM</span>
  </div>
  <div class="row">
    <button id="party" aria-pressed="false">Parti modu</button>
    <button id="music" aria-pressed="false">Ritim çal</button>
  </div>

<script>
  const stage = document.getElementById('stage');
  const floor = document.getElementById('floor');
  for (let i = 0; i < 24; i++) floor.appendChild(document.createElement('i'));

  // Hareket seçimi
  const moves = ['bounce', 'sway', 'shuffle', 'spin'];
  document.getElementById('moves').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    moves.forEach(m => stage.classList.remove('m-' + m));
    stage.classList.add('m-' + btn.dataset.move);
    document.querySelectorAll('#moves button').forEach(b => b.setAttribute('aria-pressed', b === btn));
  });

  // Tempo
  const bpm = document.getElementById('bpm');
  const bpmVal = document.getElementById('bpmVal');
  let beatSec = 0.5;
  function setTempo() {
    beatSec = 60 / bpm.value;
    document.documentElement.style.setProperty('--beat', beatSec + 's');
    bpmVal.textContent = bpm.value + ' BPM';
  }
  bpm.addEventListener('input', setTempo);

  // Parti modu
  const party = document.getElementById('party');
  party.addEventListener('click', () => {
    const on = stage.classList.toggle('party');
    party.setAttribute('aria-pressed', on);
  });

  // Klavye: 1-4 hareket, P parti, M müzik
  addEventListener('keydown', e => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) document.querySelectorAll('#moves button')[n - 1].click();
    if (e.key.toLowerCase() === 'p') party.click();
    if (e.key.toLowerCase() === 'm') musicBtn.click();
  });

  // Basit sentezlenmiş ritim (kick + hi-hat + clap)
  const musicBtn = document.getElementById('music');
  let ctx = null, timer = null, step = 0, nextTime = 0;
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.3);
  }
  function noise(t, dur, freq, vol) {
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(ctx.destination); s.start(t);
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.1) {
      const eighth = beatSec / 2;
      if (step % 2 === 0) kick(nextTime);
      if (step % 4 === 2) noise(nextTime, 0.18, 1200, 0.35);
      noise(nextTime, 0.04, 7000, step % 2 ? 0.15 : 0.08);
      nextTime += eighth; step = (step + 1) % 8;
    }
  }
  musicBtn.addEventListener('click', () => {
    if (timer) {
      clearInterval(timer); timer = null;
      musicBtn.setAttribute('aria-pressed', 'false');
      return;
    }
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      // Animasyonu ritme hizala: CSS animasyonlarını sıfırdan başlat
      stage.getAnimations({ subtree: true }).forEach(a => { a.currentTime = 0; });
      nextTime = ctx.currentTime + 0.05; step = 0;
      timer = setInterval(schedule, 25);
      musicBtn.setAttribute('aria-pressed', 'true');
    } catch (err) { musicBtn.textContent = 'Ses desteklenmiyor'; }
  });

  setTempo();
</script>
</body>
</html>
